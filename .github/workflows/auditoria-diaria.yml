name: Craque Tático | Auditoria diária de integridade

on:
  schedule:
    # 08:10 em Brasília/Belém (UTC-3); execuções agendadas podem sofrer atraso.
    - cron: '10 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craque-tatico-auditoria-diaria
  cancel-in-progress: false

jobs:
  integrity:
    name: Validar projeto e 246 cartas sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter código vigente
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes existentes e auditoria de cartas
        run: npm run check
      - name: Verificar sintaxe dos pontos de entrada
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check web/app-bridge.js
          node --check web/pwa.js
      - name: Guardar relatório da auditoria das cartas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-tatico-auditoria-diaria-246
          path: build/v229-audit-246.json
          if-no-files-found: warn
          retention-days: 14
