name: Scout PRO | CI, Windows, Android e Releases

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-pro-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verificar 246 cartas e código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de integridade offline
        run: npm run check
      - name: Disponibilizar auditoria individual das 246 cartas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-tatico-auditoria-246-v229
          path: build/v229-audit-246.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dossiê consultivo 246 cartas × cinco estilos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-tatico-v264-dossie-246-cartas-5-estilos
          path: |
            build/v264-competitive-246x5.json
            build/v264-competitive-246x5.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Auditoria V271 de ímpetos Técnica com Card ID e PP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v271-auditoria-101-tecnica
          path: build/v271-tecnica-evidencias.json
          if-no-files-found: warn
          retention-days: 30
      - name: Relatório competitivo V272 das 246 cartas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v272-246-cartas-5-estilos
          path: build/v272-competitive-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dossiê V273 individual das 246 cartas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v273-evidencias-246x5
          path: build/v273-card-evidence-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Auditoria V274 das habilidades nativas especiais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v274-nativas-especiais-246x5
          path: build/v274-special-native-evidence-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dossiê V275 comparativo de sete provas e cinco táticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v275-fichas-competitivas-246x5
          path: build/v275-competitive-evidence-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Relatório V276 - cinco skills e quatro eixos dos ímpetos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v276-portfolio-boosters-246x5
          path: build/v276-portfolio-boosters-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Relatório V277 - famílias nativas e razões dos ímpetos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v277-evidencias-246x5
          path: build/v277-evidence-matrix-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Matriz V278 de provas por edição e pendências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v278-provas-246x5
          path: build/v278-evidence-readiness-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dossiê V281 comparador por carta e cinco táticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v281-comparador-246x5
          path: build/v281-matrix-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Auditoria V282 de individualidade por Card ID e tática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v282-distincoes-246x5
          path: build/v282-individual-card-distinction-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Sensibilidade V283 por edição e cinco estilos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v283-sensibilidade-246x5
          path: build/v283-sensitivity-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dossiê V284 — 246 cartas, 5 estilos, 5 habilidades e 4 atributos dos ímpetos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v284-laboratorio-competitivo-246x5
          path: build/v284-competitive-decisions-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V285 — segunda opinião, 246 cartas × cinco estilos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v285-segunda-opiniao-246x5
          path: build/v285-quality-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V286 — auditoria do conjunto de 5 habilidades e ímpetos por edição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v286-portfolio-estrategico-246x5
          path: build/v286-strategic-portfolios-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V287 — relatório por edição e fila de revisão de evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v287-evidencias-246x5
          path: |
            build/v287-evidence-council-246x5.json
            build/v287-evidence-queue-246.csv
          if-no-files-found: warn
          retention-days: 30
      - name: V288 — auditoria de provas dos 5 slots e ímpetos por edição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v288-account-proof-246x5
          path: build/v288-account-proof-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V289 — comparação de PP e auditoria imutável das 246 edições
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v289-competitive-audit-246
          path: |
            build/v289-competitive-audit-246.json
            build/v289-evidence-queue-246.csv
          if-no-files-found: error
          retention-days: 30
      - name: V291 — relatório de proteção dos cinco slots e PP experimental
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v291-proof-training-246x5
          path: build/v291-proof-training-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V292 — relatório de confiança dos ímpetos por edição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v292-booster-confidence-246x5
          path: build/v292-booster-confidence-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V293 — relatório de integridade dos comprovantes por edição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v293-receipt-integrity-246x5
          path: build/v293-receipt-integrity-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V294 — auditoria das cinco vagas por comprovante da edição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v294-five-slot-proof-246x5
          path: build/v294-five-slot-proof-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: V296 — auditoria de recibos de nível e PP por edição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v296-progress-edition-proof-246
          path: build/v296-progress-proof-246.json
          if-no-files-found: warn
          retention-days: 30
      - name: V297 — auditoria de segurança da publicação conjunta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v297-release-joint-safety
          path: build/v297-release-safety.json
          if-no-files-found: warn
          retention-days: 30
      - name: V298 — 246 cartas x 5 estilos, bloqueio de PP divergentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v298-pp-conflict-gate-246x5
          path: build/v298-pp-conflict-gate-246x5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Sintaxe JavaScript
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check web/app-bridge.js
          node --check web/pwa.js
          node --check scripts/set-version.cjs
      - name: Conferir arquivos da compilação
        run: node scripts/verify-release-workflow.cjs
      - name: Validar formato do certificado permanente (sem acesso à chave)
        run: node scripts/official-android-sign-v99.cjs check

  windows:
    name: Windows | Instalador NSIS
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Padronizar estilos PT-BR
        run: npm run styles:ptbr
      - name: Gerar ícones premium Windows
        run: npm run brand:build
      - name: Definir versão
        run: node scripts/set-version.cjs 1.1.${{ github.run_number }} ${{ github.repository }}
      - name: Carimbar fingerprint idêntico do código web Windows
        run: npm run bundle:stamp
      - name: Gerar instalador Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:win
      - name: Garantir metadados SHA512 mesmo sem publicar antes do CI GREEN
        run: node scripts/ensure-windows-update-manifest.cjs
      - name: Incluir identificação da interface no artefato Windows
        shell: pwsh
        run: Copy-Item web/scout-build-info.json dist/scout-build-info.json
      - name: Verificar instalador e metadados de atualização
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist\ScoutPRO-Setup-*.exe -ErrorAction Stop)
          $meta = @(Get-ChildItem dist\latest.yml -ErrorAction Stop)
          if ($exe.Count -ne 1 -or $meta.Count -ne 1) { throw 'Instalador ou latest.yml ausente' }
          Write-Host "Instalador OK: $($exe[0].Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: scout-pro-windows
          path: |
            dist/ScoutPRO-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/scout-build-info.json
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android | APK e assinatura persistente
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keys.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Usar SDK Android preinstalado no GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'SDK Android ausente no runner' >&2; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK Android disponível: $SDK"
      - name: Verificar segredos da assinatura
        id: keys
        env:
          MASTER: ${{ secrets.ANDROID_RELEASE_SECRET }}
          KEY64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for value in "$KEY64" "$KSPASS" "$KEYALIAS" "$KEYPASS"; do
            if [[ -n "$value" ]]; then count=$((count+1)); fi
          done
          if [[ -n "$MASTER" ]]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'mode=master' >> "$GITHUB_OUTPUT"
            echo 'Assinatura oficial V99 configurada com segredo mestre; certificado fixo será verificado.'
          elif [[ "$count" -eq 4 ]]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'mode=legacy' >> "$GITHUB_OUTPUT"
            echo 'Assinatura persistente legada configurada.'
          elif [[ "$count" -eq 0 ]]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'mode=none' >> "$GITHUB_OUTPUT"
            echo 'Sem assinatura oficial: APK de QA não será publicado em Releases. Configure ANDROID_RELEASE_SECRET.'
          else
            echo 'ERRO: configure ANDROID_RELEASE_SECRET ou os quatro segredos ANDROID_* legados.' >&2
            exit 1
          fi
      - name: Informar status de publicação Android
        shell: bash
        run: |
          if [[ '${{ steps.keys.outputs.signed }}' == 'true' ]]; then
            echo 'Android: assinatura persistente configurada; APK oficial será publicado após validação.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Android: somente APK DE TESTE; não é atualização instalável sobre versões assinadas com outra chave. Configure os quatro segredos ANDROID_* para futuras releases oficiais.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Versão Android
        run: node scripts/set-version.cjs 1.1.${{ github.run_number }} ${{ github.repository }}
      - name: Padronizar estilos PT-BR
        run: npm run styles:ptbr
      - name: Gerar ícones premium Android
        run: npm run brand:build
      - name: Carimbar fingerprint idêntico do código web Android
        run: npm run bundle:stamp
      - name: Criar projeto Android e sincronizar catálogo offline
        run: |
          npx cap add android
          node scripts/install-native-updater-v102.cjs
          npx cap sync android
          python3 scripts/install-android-icons.py
      - name: Versão nativa progressiva
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/set-android-version.py "${BUILD_NUMBER}" "1.1.${BUILD_NUMBER}"
      - name: Compilar APK de teste (sem Release)
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p ../build-demo
          cp app/build/outputs/apk/debug/app-debug.apk ../build-demo/ScoutPRO-Android-TESTE.apk
          cp ../web/scout-build-info.json ../build-demo/scout-build-info.json
      - name: Compilar APK release para assinatura
        if: steps.keys.outputs.signed == 'true'
        shell: bash
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Assinar APK oficial com identidade permanente V99
        if: steps.keys.outputs.mode == 'master'
        env:
          ANDROID_RELEASE_SECRET: ${{ secrets.ANDROID_RELEASE_SECRET }}
        shell: bash
        run: node scripts/official-android-sign-v99.cjs sign
      - name: Assinar e verificar APK release
        if: steps.keys.outputs.mode == 'legacy'
        shell: bash
        env:
          KEY64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/scout-release.jks' EXIT
          printf '%s' "$KEY64" | base64 -d > /tmp/scout-release.jks
          chmod 600 /tmp/scout-release.jks
          mkdir -p release-out
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$ZIPALIGN" && test -n "$APKSIGNER"
          "$ZIPALIGN" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release-out/scout-aligned.apk
          "$APKSIGNER" sign --ks /tmp/scout-release.jks --ks-key-alias "$KEYALIAS" --ks-pass env:KSPASS --key-pass env:KEYPASS --out release-out/ScoutPRO-Android.apk release-out/scout-aligned.apk
          "$APKSIGNER" verify --verbose release-out/ScoutPRO-Android.apk
          (cd release-out && sha256sum ScoutPRO-Android.apk > ScoutPRO-Android.apk.sha256)
          rm -f release-out/scout-aligned.apk
      - name: Verificar estrutura instalável do APK oficial
        if: steps.keys.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="release-out/ScoutPRO-Android.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT" || { echo 'AAPT não encontrado' >&2; exit 1; }
          "$AAPT" dump badging "$APK" > /tmp/scout-apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/scout-apk-manifest.txt
          grep -Fq 'br.com.scoutpro.offline.ScoutUpdateFileProvider' /tmp/scout-apk-manifest.txt
          grep -Fq 'br.com.scoutpro.offline.scoutupdate.files' /tmp/scout-apk-manifest.txt
          echo "FileProvider exclusivo e autoridade do atualizador presentes no APK assinado."

          grep -Fq "package: name='br.com.scoutpro.offline' versionCode='${{ github.run_number }}' versionName='1.1.${{ github.run_number }}'" /tmp/scout-apk-badging.txt
          echo "Pacote oficial legível por aapt: identificador e versão confirmados."
          # V297: também no modo legacy, a assinatura deve corresponder ao
          # certificado fixo da instalação oficial. Chave diferente BLOQUEIA
          # ambas as publicações, mesmo se o APK for sintaticamente válido.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/^Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          EXPECTED_CERT='818a2b4144234810b9e6e68bddb1ccb1cf9f3b6636dcc0adc31536a4fec02c04'
          if [[ -z "$ACTUAL_CERT" || "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo 'ERRO: certificado Android diferente da identidade oficial fixa. Nenhuma release será publicada.' >&2
            exit 1
          fi
          echo "APK assinado com certificado oficial fixo V99."
      - name: Arquivar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: scout-pro-android-teste
          path: |
            build-demo/ScoutPRO-Android-TESTE.apk
            build-demo/scout-build-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Arquivar APK de atualização assinado
        if: steps.keys.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scout-pro-android-assinado
          path: |
            release-out/ScoutPRO-Android.apk
            release-out/*.sha256
          if-no-files-found: error
          retention-days: 14

  # V297: uma única publicação conjunta. Se faltar assinatura oficial Android,
  # não lançar Windows isolado e deixar o atualizador Android sem equivalente.
  release:
    name: Publicar Android e Windows somente com ambos oficiais
    needs: [validate, windows, android]
    if: ${{ github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scout-pro-windows
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: scout-pro-android-teste
          path: android-verify
      - uses: actions/download-artifact@v4
        with:
          name: scout-pro-android-assinado
          path: assets
      - name: Garantir a mesma interface no Android e no Windows
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/scout-build-info.json
          test -s android-verify/scout-build-info.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          windows=json.loads(Path('assets/scout-build-info.json').read_text(encoding='utf-8-sig'))
          android=json.loads(Path('android-verify/scout-build-info.json').read_text(encoding='utf-8-sig'))
          keys=('schema','version','git_revision','bundle_fingerprint','source_count')
          different=[key for key in keys if windows.get(key)!=android.get(key)]
          if different:
              raise SystemExit('PARIDADE INVALIDA: divergencias em '+', '.join(different))
          if windows.get('git_revision') != '${{ github.sha }}':
              raise SystemExit('PARIDADE INVALIDA: commit de origem nao corresponde ao build.')
          print('PARIDADE CONFIRMADA: Windows e Android sao',windows['version'],windows['git_revision'][:12],windows['bundle_fingerprint'])
          PY
      - name: Conferir os dois pacotes antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/latest.yml
          test "$(find assets -maxdepth 1 -name 'ScoutPRO-Setup-*.exe' -type f | wc -l)" -eq 1
          grep -q "version: 1.1.${{ github.run_number }}" assets/latest.yml
          test -s assets/ScoutPRO-Android.apk
          test -s assets/ScoutPRO-Android.apk.sha256
          (cd assets && sha256sum -c ScoutPRO-Android.apk.sha256)
          test -s android-verify/scout-build-info.json
          ls -lh assets
      - name: Proibir colisão com versões oficiais existentes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.1.${{ github.run_number }}"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")"
          TAG_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$TAG")"
          if [[ "$STATUS" != '404' || "$TAG_STATUS" != '404' ]]; then
            echo "ERRO: tag ou release $TAG já existe, ou consulta falhou (HTTP $STATUS/$TAG_STATUS)." >&2
            exit 1
          fi
      - name: Enviar Android e Windows para uma release em rascunho
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Scout PRO v1.1.${{ github.run_number }}
          generate_release_notes: true
          draft: true
          make_latest: false
          files: |
            assets/ScoutPRO-Setup-*.exe
            assets/*.blockmap
            assets/latest.yml
            assets/ScoutPRO-Android.apk
            assets/ScoutPRO-Android.apk.sha256
          fail_on_unmatched_files: true
      - name: Conferir no GitHub os cinco artefatos antes de ativar os atualizadores
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.${{ github.run_number }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' | grep -Fxq 'true'
          FILES="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          SETUP="$(basename "$(find assets -maxdepth 1 -type f -name 'ScoutPRO-Setup-*.exe' -print -quit)")"
          for REQUIRED in "$SETUP" "$SETUP.blockmap" latest.yml ScoutPRO-Android.apk ScoutPRO-Android.apk.sha256; do
            printf '%s\n' "$FILES" | grep -Fxq "$REQUIRED" || {
              echo "ERRO: arquivo $REQUIRED ausente na release rascunho." >&2
              exit 1
            }
          done
      - name: Ativar release conjunta somente após conferência remota
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "v1.1.${{ github.run_number }}" \
            --repo "${{ github.repository }}" --draft=false --latest
