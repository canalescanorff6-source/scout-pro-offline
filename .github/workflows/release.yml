name: Scout PRO | CI, Windows, Android e Releases

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-pro-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verificar 246 cartas e código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de integridade offline
        run: npm run check
      - name: Sintaxe JavaScript
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check web/app-bridge.js
          node --check web/pwa.js
          node --check scripts/set-version.cjs
      - name: Conferir arquivos da compilação
        run: node scripts/verify-release-workflow.cjs

  windows:
    name: Windows | Instalador NSIS
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Padronizar estilos PT-BR
        run: npm run styles:ptbr
      - name: Gerar ícones premium Windows
        run: npm run brand:build
      - name: Definir versão
        run: node scripts/set-version.cjs 1.1.${{ github.run_number }} ${{ github.repository }}
      - name: Gerar instalador Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:win
      - name: Garantir metadados SHA512 mesmo sem publicar antes do CI GREEN
        run: node scripts/ensure-windows-update-manifest.cjs
      - name: Verificar instalador e metadados de atualização
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist\ScoutPRO-Setup-*.exe -ErrorAction Stop)
          $meta = @(Get-ChildItem dist\latest.yml -ErrorAction Stop)
          if ($exe.Count -ne 1 -or $meta.Count -ne 1) { throw 'Instalador ou latest.yml ausente' }
          Write-Host "Instalador OK: $($exe[0].Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: scout-pro-windows
          path: |
            dist/ScoutPRO-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android | APK e assinatura persistente
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keys.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Usar SDK Android preinstalado no GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'SDK Android ausente no runner' >&2; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK Android disponível: $SDK"
      - name: Verificar segredos da assinatura
        id: keys
        env:
          KEY64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for value in "$KEY64" "$KSPASS" "$KEYALIAS" "$KEYPASS"; do
            if [[ -n "$value" ]]; then count=$((count+1)); fi
          done
          if [[ "$count" -eq 4 ]]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'Assinatura persistente configurada: é possível publicar release atualizável.'
          elif [[ "$count" -eq 0 ]]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhum segredo configurado. Build DEMO de CI, NÃO será publicada em Releases.'
          else
            echo 'ERRO: configure os quatro segredos ANDROID_* antes de gerar uma release.' >&2
            exit 1
          fi
      - name: Informar status de publicação Android
        shell: bash
        run: |
          if [[ '${{ steps.keys.outputs.signed }}' == 'true' ]]; then
            echo 'Android: assinatura persistente configurada; APK oficial será publicado após validação.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Android: somente APK DE TESTE; não é atualização instalável sobre versões assinadas com outra chave. Configure os quatro segredos ANDROID_* para futuras releases oficiais.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Versão Android
        run: node scripts/set-version.cjs 1.1.${{ github.run_number }} ${{ github.repository }}
      - name: Padronizar estilos PT-BR
        run: npm run styles:ptbr
      - name: Gerar ícones premium Android
        run: npm run brand:build
      - name: Criar projeto Android e sincronizar catálogo offline
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/install-android-icons.py
      - name: Versão nativa progressiva
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/set-android-version.py "${BUILD_NUMBER}" "1.1.${BUILD_NUMBER}"
      - name: Compilar APK de teste (sem Release)
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p ../build-demo
          cp app/build/outputs/apk/debug/app-debug.apk ../build-demo/ScoutPRO-Android-TESTE.apk
      - name: Compilar APK release para assinatura
        if: steps.keys.outputs.signed == 'true'
        shell: bash
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Assinar e verificar APK release
        if: steps.keys.outputs.signed == 'true'
        shell: bash
        env:
          KEY64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/scout-release.jks' EXIT
          printf '%s' "$KEY64" | base64 -d > /tmp/scout-release.jks
          chmod 600 /tmp/scout-release.jks
          mkdir -p release-out
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$ZIPALIGN" && test -n "$APKSIGNER"
          "$ZIPALIGN" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release-out/scout-aligned.apk
          "$APKSIGNER" sign --ks /tmp/scout-release.jks --ks-key-alias "$KEYALIAS" --ks-pass env:KSPASS --key-pass env:KEYPASS --out release-out/ScoutPRO-Android.apk release-out/scout-aligned.apk
          "$APKSIGNER" verify --verbose release-out/ScoutPRO-Android.apk
          (cd release-out && sha256sum ScoutPRO-Android.apk > ScoutPRO-Android.apk.sha256)
          rm -f release-out/scout-aligned.apk
      - name: Arquivar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: scout-pro-android-teste
          path: build-demo/ScoutPRO-Android-TESTE.apk
          if-no-files-found: error
          retention-days: 7
      - name: Arquivar APK de atualização assinado
        if: steps.keys.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scout-pro-android-assinado
          path: |
            release-out/ScoutPRO-Android.apk
            release-out/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar atualização Windows após CI GREEN
    needs: [validate, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scout-pro-windows
          path: assets
      - name: Verificar instalador e manifesto de atualização Windows
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/latest.yml
          test "$(find assets -maxdepth 1 -name 'ScoutPRO-Setup-*.exe' -type f | wc -l)" -eq 1
          grep -q "version: 1.1.${{ github.run_number }}" assets/latest.yml
          ls -lh assets
      - name: Publicar Windows para atualização automática
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Scout PRO v1.1.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: |
            assets/ScoutPRO-Setup-*.exe
            assets/*.blockmap
            assets/latest.yml
          fail_on_unmatched_files: true

  release_android:
    name: Anexar APK oficial somente com assinatura permanente
    needs: [validate, windows, android, release]
    if: ${{ needs.android.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scout-pro-android-assinado
          path: assets
      - name: Verificar o APK assinado
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/ScoutPRO-Android.apk
          test -s assets/ScoutPRO-Android.apk.sha256
          cd assets
          sha256sum -c ScoutPRO-Android.apk.sha256
      - name: Adicionar APK oficial à mesma versão publicada
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          make_latest: true
          files: |
            assets/ScoutPRO-Android.apk
            assets/ScoutPRO-Android.apk.sha256
          fail_on_unmatched_files: true
