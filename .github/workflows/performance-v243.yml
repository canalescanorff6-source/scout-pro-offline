name: Craque Tático | V243 fluidez e ficha única

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/premium.js'
      - 'web/craque-card-effects-v234.js'
      - 'web/scout-card-curation-v229.js'
      - 'scripts/qa-performance-v243.py'
      - 'scripts/test-catalog-performance-v243.cjs'
      - '.github/workflows/performance-v243.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-performance:
    name: Catálogo 246 cartas e Cardona em Chromium mobile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar estilos PT-BR com dados originais do catálogo
        run: npm run styles:ptbr
      - name: Regressão de DOM e cartas originais
        run: node scripts/test-catalog-performance-v243.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Chromium controlado
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Conferir interação real com animações habilitadas
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory web >/tmp/craque-v243.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          python scripts/qa-performance-v243.py
      - name: Captura de evidências para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craque-v243-mobile-catalog-e-cardona
          path: artifacts/performance-v243/
          if-no-files-found: warn
          retention-days: 14
