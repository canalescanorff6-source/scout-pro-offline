name: Scout PRO | QA visual Android e Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/qa-review-v379.py'
      - 'scripts/qa-all-cards-v379.py'
      - 'scripts/qa-editorial-theme.py'
      - 'scripts/qa-main-sheet-v378.py'
      - 'scripts/qa-competitive-batch-v380.py'
      - 'scripts/qa-levels-v381.py'
      - 'scripts/qa-team-plan-v382.py'
      - 'scripts/qa-account-entry-v382.py'
      - 'scripts/qa_navigation_v378.py'
      - 'scripts/qa-visual-v195.py'
      - 'scripts/qa-visual-rebuild-v361.py'
      - 'scripts/qa-app-shell-v362.py'
      - 'scripts/qa-friends-focus-v363.py'
      - 'scripts/qa-owned-main-v364.py'
      - 'scripts/qa-managers-v307.py'
      - 'scripts/qa-pp-v309.py'
      - 'scripts/qa-position-v311.py'
      - 'scripts/qa-manager-history-v325.py'
      - 'scripts/qa-premium-first-view-v326.py'
      - 'scripts/qa-ficha-decision-v327.py'
      - 'scripts/qa-frontier-context-v339.py'
      - 'scripts/qa-live-equipment-v342.py'
      - 'scripts/qa-booster-slot-v343.py'
      - 'scripts/qa-contextual-suggestions-v344.py'
      - 'scripts/qa-skill-alias-v345.py'
      - 'scripts/qa-additional-capacity-v347.py'
      - 'scripts/qa-booster-ranking-v348.py'
      - 'scripts/qa-booster-inventory-v349.py'
      - 'scripts/qa-contextual-explanation-v350.py'
      - 'scripts/qa-atomic-premium-boot-v351.py'
      - 'scripts/qa-premium-interiors-v352.py'
      - 'scripts/qa-premium-workspaces-v353.py'
      - 'scripts/qa-detail-first-paint-v354.py'
      - 'scripts/qa-pwa-safe-update-v355.py'
      - 'scripts/qa-native-premium-entry-v356.py'
      - 'scripts/qa-manager-selector-v328.py'
      - 'scripts/qa-manager-premium-v329.py'
      - 'scripts/qa-lineup-focus-v330.py'
      - 'scripts/qa-formation-v314.py'
      - '.github/workflows/visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/qa-visual-v195.py'
      - 'scripts/qa-manager-history-v325.py'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  screenshots:
    name: Capturas visuais em 8 resoluções Android e Windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Chromium controlado
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Renderizar as fichas e coletar métricas
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory web >/tmp/scout-visual-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          # V315: testar primeiro o caso novo; falhar claramente em bloqueios de navegação.
          # Mantém todos os QA anteriores, sem afrouxar assertivas.
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-editorial-theme.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-card-info-editor.py
          timeout --signal=TERM --kill-after=10s 60s python -u scripts/qa-tactical-mobile.py
          timeout --signal=TERM --kill-after=10s 90s python -u scripts/qa-backup-offline.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-review-v379.py
          timeout --signal=TERM --kill-after=10s 300s python -u scripts/qa-all-cards-v379.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-main-sheet-v378.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-competitive-batch-v380.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-levels-v381.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-team-plan-v382.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-function-method-v383.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-manual-in-app-v384.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-account-entry-v382.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-rating-v376.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-owned-main-v364.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-friends-focus-v363.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-app-shell-v362.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-visual-rebuild-v361.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-lineup-focus-v330.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-manager-premium-v329.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-manager-selector-v328.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-ficha-decision-v327.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-frontier-context-v339.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-live-equipment-v342.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-booster-slot-v343.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-contextual-suggestions-v344.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-skill-alias-v345.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-additional-capacity-v347.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-booster-ranking-v348.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-booster-inventory-v349.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-contextual-explanation-v350.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-atomic-premium-boot-v351.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-premium-interiors-v352.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-premium-workspaces-v353.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-detail-first-paint-v354.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-pwa-safe-update-v355.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-native-premium-entry-v356.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-premium-first-view-v326.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-manager-history-v325.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-formation-v314.py
          timeout --signal=TERM --kill-after=10s 300s python -u scripts/qa-visual-v195.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-managers-v307.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-pp-v309.py
          timeout --signal=TERM --kill-after=10s 180s python -u scripts/qa-position-v311.py
      - name: Anexar screenshots e relatório para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-pro-visual-qa
          path: artifacts/visual-qa/
          if-no-files-found: warn
          retention-days: 14
